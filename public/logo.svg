<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00152B"/>
      <stop offset="50%" stop-color="#001F3F"/>
      <stop offset="100%" stop-color="#000D1A"/>
    </linearGradient>

    <!-- Metallic Gold Gradient Primary -->
    <linearGradient id="goldBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="30%" stop-color="#F3D068"/>
      <stop offset="70%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#997517"/>
    </linearGradient>

    <!-- Metallic Gold Gradient Dark Side -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C352"/>
      <stop offset="50%" stop-color="#B88E22"/>
      <stop offset="100%" stop-color="#705206"/>
    </linearGradient>

    <!-- Cyan AI Spark Gradient -->
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80F3FF"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>

    <!-- Subtle Outer Ring Glow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>
  
  <!-- Outer Decorative Border -->
  <rect x="12" y="12" width="488" height="488" rx="84" fill="none" stroke="url(#goldBright)" stroke-width="3" stroke-opacity="0.4"/>

  <!-- 360-Degree Intelligence Orbital Ring (Outer Segmented Ring) -->
  <circle cx="256" cy="240" r="176" fill="none" stroke="url(#goldBright)" stroke-width="4" stroke-dasharray="18 10 30 10 80 10 40 10" stroke-opacity="0.8" filter="url(#goldGlow)"/>
  <circle cx="256" cy="240" r="192" fill="none" stroke="url(#goldDark)" stroke-width="2" stroke-dasharray="120 16 60 16" stroke-opacity="0.5"/>

  <!-- Orbital Node Tech Dots -->
  <circle cx="256" cy="48" r="6" fill="#00E5FF"/>
  <circle cx="448" cy="240" r="5" fill="url(#goldBright)"/>
  <circle cx="64" cy="240" r="5" fill="url(#goldBright)"/>
  <circle cx="256" cy="432" r="6" fill="url(#goldBright)"/>

  <!-- Stylized Geometric UNIKORN Horn Crest -->
  <g transform="translate(256, 230)">
    <!-- Central Main Spike (Left Facet - Bright Gold) -->
    <path d="M 0,-140 L 0,80 L -42,30 Z" fill="url(#goldBright)"/>
    
    <!-- Central Main Spike (Right Facet - Shadow Gold) -->
    <path d="M 0,-140 L 42,30 L 0,80 Z" fill="url(#goldDark)"/>

    <!-- Wing Facet Left High -->
    <path d="M 0,-80 L -42,30 L -75,-15 Z" fill="url(#goldBright)" opacity="0.95"/>
    
    <!-- Wing Facet Right High -->
    <path d="M 0,-80 L 75,-15 L 42,30 Z" fill="url(#goldDark)" opacity="0.95"/>

    <!-- Outer Wing Left Base -->
    <path d="M -42,30 L -105,20 L -55,80 Z" fill="url(#goldDark)"/>
    
    <!-- Outer Wing Right Base -->
    <path d="M 42,30 L 55,80 L 105,20 Z" fill="url(#goldBright)"/>

    <!-- Lower Diamond Core Connector -->
    <path d="M 0,80 L -35,120 L 0,145 L 35,120 Z" fill="url(#goldBright)"/>
    <path d="M 0,80 L 0,145 L 35,120 Z" fill="url(#goldDark)"/>

    <!-- Apex AI Spark Star -->
    <path d="M 0,-165 L 5,-145 L 25,-140 L 5,-135 L 0,-115 L -5,-135 L -25,-140 L -5,-145 Z" fill="url(#cyanSpark)"/>
    <circle cx="0" cy="-140" r="4" fill="#FFFFFF"/>
  </g>

  <!-- 360 Degree Inner Swoosh Ring -->
  <path d="M 110,290 A 150,150 0 1,0 402,290" fill="none" stroke="url(#goldBright)" stroke-width="8" stroke-linecap="round"/>
  <polygon points="402,275 422,295 392,305" fill="url(#goldBright)"/>

  <!-- Brand Typography Subtitle embedded inside Emblem -->
  <text x="256" y="465" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="6">
    UNIKORN<tspan fill="#D4AF37">360</tspan>
  </text>
  <text x="256" y="490" font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#00E5FF" text-anchor="middle" letter-spacing="4" opacity="0.9">
    AI SOLUTIONS
  </text>
</svg>
